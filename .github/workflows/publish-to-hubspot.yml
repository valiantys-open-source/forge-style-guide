name: Publish README to HubSpot

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/scripts/**'
      - '.github/workflows/publish-to-hubspot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/scripts/**'
      - '.github/workflows/publish-to-hubspot.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Convert README.md to HTML
        run: python .github/scripts/md_to_html.py README.md

      - name: Test Markdown converter
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Validate publisher
        run: node --check .github/scripts/publish-to-hubspot.js

      - name: Verify generated HTML
        run: test -s forge_style_guide_snippet.html

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: hubspot-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Convert README.md to HTML
        run: python .github/scripts/md_to_html.py README.md

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Publish to HubSpot
        run: node .github/scripts/publish-to-hubspot.js
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
